  q: "`ft_printf(\"%u\", -1)` prints `18446744073709551615` instead of `4294967295`. Find the faulty line.",
  why: "`%u` expects an `unsigned int`, but line 9 reads an `int`: the -1 is converted to `unsigned long` with sign extension and you get 2^64-1. It must read `va_arg(ap, unsigned int)`, so that -1 becomes 4294967295 (2^32-1). General rule: the type passed to `va_arg` is dictated by the conversion specifier, not by the value you think is arriving.",
  hint: "Compare the type `va_arg` reads in `%d` and in `%u`." },

"p3q7": {
  q: "Simulate `ft_printf` with a null `%s`, a `%c`, a negative `%d` and a negative `%u`.",
  why: "`%s` with NULL writes `(null)` (6 bytes); `%c` receives the code 65, which is `A`; `%d` with -7 writes `-7` (2 bytes) and `%u` reinterprets -1 as unsigned: 4294967295 (10 bytes). Total: 6 + 1 + 1 + 1 + 2 + 1 + 10 = 22 bytes (the 3 literal bars included).",
  hint: "The literal `|` characters count towards the return value too." },

"p3q8": {
  q: "Which of these `ft_printf` calls return exactly 5?",
  opts: [
    "`ft_printf(\"%d\", -1234)`",
    "`ft_printf(\"%s\", NULL)`",
    "`ft_printf(\"100%%\")`",
    "`ft_printf(\"%c%c%c%c%c\", 'h', 'o', 'l', 'a', '!')`",
    "`ft_printf(\"%u\", -1)`"
  ],
  why: "`-1234` is 5 bytes (sign and four digits) and the five `%c` write one byte each. `%s` with NULL writes `(null)`: 6. `100%%` writes `100%`: 4, because `%%` produces a single `%`. And `%u` with -1 is 10 digits. The return value counts what is written, not the length of the format string.",
  hint: "Do not count the format string: count what comes out on screen, sign included." },

"p3q9": {
  q: "Complete the line that prints the last digit of `n` (with `n >= 0`) as a character.",
  why: "`n % 10` is a number between 0 and 9, but `write` writes bytes that are interpreted as characters. The character `'0'` is 48 in ASCII and the digits are consecutive, so `'0' + 7` is `'7'`. Prefer `'0'` over 48: it explains itself.",
  hint: "In ASCII the digits are consecutive, starting at the character zero." },

"p3q10": {
  q: "While debugging you write `printf(\"A\"); ft_printf(\"B\");` and run the program (in a terminal or redirected to a file). What will you see?",
  opts: ["`AB`, always", "Only `B`: `printf` is disabled if you call `write`", "`BA`: `printf` keeps the A in a buffer and does not flush it until exit", "The order is random"],
  why: "libc's `printf` accumulates output in the `stdout` buffer (an intermediate memory area) and only flushes it when it fills up, on a `\\n` in a terminal, or when the program ends. Your `ft_printf` uses `write` directly, so `B` comes out first: `BA`. That is why you should not mix `printf` and `ft_printf` while debugging: the output order is not the code order.",
  hint: "Ask yourself who writes immediately: `write` or `printf`?" },

"p4q1": {
  q: "Hexadecimal (base 16) uses the digits `0-9` and `a-f` (a=10 … f=15). How is 1000 written in hexadecimal?",
  opts: ["`3e8`", "`e83`", "`3d8`", "`fa0`"],
  why: "Divide by 16: 1000 = 62·16 + 8, then 62 = 3·16 + 14 (`e`), then 3 = 0·16 + 3. The remainders come out in the order 8, `e`, 3, i.e. from the least to the most significant digit, and are read backwards: `3e8`. Check: 3·256 + 14·16 + 8 = 1000.",
  hint: "Divide by 16 and read the remainders from bottom to top." },

"p4q2": {
  q: "What does `ft_printf(\"%x\", -42)` print on a machine with a 32-bit `int`?",
  opts: ["`-2a`", "`d6`", "`2a`", "`ffffffd6`"],
  why: "`%x` reads an `unsigned int`: the 32 bits of -42 (two's complement) are reinterpreted as the unsigned number 4294967254, which in hexadecimal is `ffffffd6`. The `%x`, `%X` and `%u` conversions never print a minus sign; that is why `ft_putunbr` takes an unsigned value and negatives need no special handling.",
  hint: "A negative number viewed as unsigned starts with lots of 1 bits." },

"p4q3": {
  q: "`ft_putunbr` converts to base 16 using `n % base` (last digit) and `n / base` (the rest of the number). Why use recursion?",
  opts: [
    "Because `%` does not work with large numbers",
    "To save calls to `write`",
    "So that the most significant digit is printed first: division yields the digits backwards",
    "Because base 16 cannot be done with a `while` loop"
  ],
  why: "Dividing repeatedly gives you the digits from right to left (least significant first), but they must be printed left to right. Recursion first calls itself with `n / base` (printing everything to the left) and then writes `n % base`. A `while` loop would also work with a buffer or by counting powers, but recursion is the shortest way and needs no extra memory.",
  hint: "Think of 1000: which digit comes out first when dividing, and which one do we want to write first?" },

"p4q4": {
  q: "Complete the line that picks the digit matching the last digit of `n` in the given base.",
  why: "`digits` is the string `\"0123456789abcdef\"` (or the uppercase one) and the remainder of dividing by the base is exactly the index of the digit: in base 16, 255 % 16 = 15, and `digits[15]` is `f`. Dividing by 10 would only work in decimal; using the `base` variable lets a single function serve `%u`, `%x`, `%X` and `%p`.",
  hint: "It must be 10 for `%u` and 16 for `%x`." },

"p4q5": {
  q: "Put `ft_putunbr(n, base, upper)` in order: it prints `n` as unsigned in the given base (lowercase or uppercase) and returns the bytes written.",
  why: "First the variables, then the alphabet is chosen, then the left part is printed recursively and finally the current digit. If you swap the last two operations the number comes out reversed. With `digits[n / base]` you would write the wrong digit, and recursing with `n % base` would print a single digit. The condition `n >= base` also covers `n == 0`: it prints `0` directly.",
  hint: "Before writing the current digit, everything to its left must already be written." },

"p4q6": {
  q: "In `ft_putptr`, why is the pointer converted with `(unsigned long)p` rather than `(int)p`?",
  opts: [
    "Because on 64 bits a pointer takes 8 bytes and an `int` only 4: the upper 32 bits would be lost",
    "Because `int` cannot hold hexadecimal values",
    "Because `unsigned long` is faster",
    "Because `write` only accepts `unsigned long`"
  ],
  why: "On 64-bit Linux a typical address is `0x7ffe7e2bfc54` (6 useful bytes). Casting it to `int` or `unsigned int` would leave you with `0x7e2bfc54`, a different address. `unsigned long` has the same size as a pointer on 64-bit Linux/macOS, and `unsigned` prevents the hexadecimal from being printed with a sign.",
  hint: "Compare the size in bytes of a pointer and of an `int`." },

"p4q7": {
  q: "Put `ft_putptr` in order: on Linux it prints `(nil)` if the pointer is NULL; otherwise `0x` followed by the address in hexadecimal. It returns the bytes written.",
  why: "The NULL case is handled before writing anything: if you printed `0x` and then `(nil)` you would get `0x(nil)`. Then `0x` and the value in base 16 (lowercase), adding the two byte counts. On macOS, `printf` of NULL gives `0x0` (hence the `0x0` distractor), but on Linux it is `(nil)`, which is the behavior we copy.",
  hint: "The special case (NULL) goes first and ends the function with `return`." },

"p4q8": {
  q: "`ft_printf(\"%x\", 16)` prints `0` instead of `10`, and `%u` with 10 prints `0`. With 17 everything works. Find the faulty line.",
  why: "It is a boundary error (off-by-one): with `n > base`, when `n` is exactly equal to the base there is no recursion and only `digits[n % base]` is written, which is `digits[0]`: `0`. It needs `n >= base`: 16 in base 16 has two digits. With 17 it does recurse, which is why it seems to work. Always test the boundary values: 0, base - 1, base and base + 1.",
  hint: "How many digits does the number equal to the base have?" },

"p4q9": {
  q: "Simulate `ft_printf` with a negative in `%x`, a `%X` and a null `%p`.",
  why: "-42 as unsigned is `ffffffd6` (8 bytes, lowercase because of `%x`). 3054 is 0xBEE and `%X` writes it in uppercase: `BEE`. The null `%p` prints `(nil)` (5 bytes) on Linux; on macOS it would be `0x0`. Total: 8 + 1 + 3 + 1 + 5 = 18 bytes.",
  hint: "Remember: `%x` reads a 32-bit `unsigned int`." },

"p4q10": {
  q: "Which of these statements about `%x`, `%X` and `%p` are correct on Linux?",
  opts: [
    "`%x` with 255 writes 2 bytes (`ff`)",
    "`%x` with 256 writes 2 bytes",
    "`%p` with NULL writes 5 bytes (`(nil)`)",
    "`%p` with NULL writes `0x0`, as on macOS",
    "`%X` with 255 writes `0XFF`",
    "`%x` with 0 writes the character `0` (1 byte)"
  ],
  why: "255 = `ff` (2 digits) and 256 = `100` (3 digits). With NULL, Linux prints `(nil)` and macOS `0x0`. `%X` only changes the letters to uppercase (`FF`); the `0X` prefix would only appear with the bonus `#` flag. The number 0 is written as `0`: if your loop were `while (n > 0)` it would write nothing, which is why recursion with `n >= base` is safer.",
  hint: "Count digits: every 16 times more in value adds one hexadecimal digit." }
});

/* ===== PRINTF QUEST · content EN · sectors 5 (LIMITS) and 6 (BONUS) ===== */
Object.assign(EN.q, {
"p5q1": {
  q: "You mix libc `printf` and `write` in one program and redirect the output to a file (`./a.out > out.txt`): `printf(\"A\"); write(1, \"B\", 1); printf(\"C\\n\"); write(1, \"D\\n\", 2);`. What does `out.txt` contain?",
  opts: ["`ABC\\nD\\n`", "`BD\\nAC\\n`", "`AC\\nBD\\n`", "`BAC\\nD\\n`"],
  why: "`printf` does not write immediately: it keeps the text in a stdio buffer (an in-memory staging area) and only calls `write` when the buffer fills up, on `fflush`, or when the program ends. `write` goes straight to the kernel. With a file or a pipe, stdout is fully buffered, so `B` and `D\\n` come out first and `AC\\n` at the end. On a terminal the buffer is line-based (flushed at every `\\n`) and you would get `BAC\\nD\\n`. That is why your `ft_printf` must always use `write` and never be mixed with `printf` in your tests.",
  hint: "One of them keeps the text in memory and the other sends it to the kernel right away." },
"p5q2": {
  q: "Three awkward values: the character with code 0, a `NULL` in `%s` and a null pointer in `%p`. Follow `ft_printf` step by step.",
  why: "`%c` with 0 really writes a NUL byte (`write(1, &c, 1)` does not stop just because the value is 0) and counts as 1 in the return value, even though you cannot see it on screen. `%s` with `NULL` prints `(null)` (6 bytes), as glibc does, and `%p` with `NULL` prints `(nil)` (5 bytes) on Linux; on macOS it would be `0x0`. Total: `[`, NUL, `]`, `(null)`, `|`, `(nil)` = 15 bytes. That is why `%c` uses `ft_putchar` and not `ft_putstr`: a string starting with NUL would look empty and write nothing.",
  hint: "The NUL counts as one more byte, and `(null)` and `(nil)` have different lengths." },
"p5q3": {
  q: "A classic edge case: the format string ends with `%` (for example `ft_printf(\"100%\")`). Fill in the condition so that a trailing `%` is not treated as the start of a conversion.",
  why: "If `%` is the last character, `fmt[1]` is the terminator `'\\0'`. Without this check, `*++fmt` points at the `\\0`, `ft_conv` receives it as a \"conversion\" and the final `fmt++` skips over the terminator: the loop keeps reading memory that is not yours. With `fmt[1]` in the condition, the trailing `%` falls into the `else` branch and is printed as an ordinary character. The libc returns -1 in this case instead; the subject does not define it, so either behaviour is defensible as long as you never read outside the string.",
  hint: "Look at the character right after the current `%`." },
"p5q4": {
  q: "The norminette (42's style checker) is part of your grade. Which of these rules are true?",
  opts: ["A function body cannot have more than 25 lines.", "A file cannot have more than 5 functions.", "`for` is allowed if the loop fits on one line.", "A function can take up to 6 parameters.", "You cannot declare and initialize a local variable on the same line (`int len = 0;`).", "Local variables can be declared in the middle of the function."],
  why: "The norm limits functions to 25 lines, files to 5 functions and functions to 4 parameters. It forbids `for` (you use `while`) and requires variables to be declared at the top of the block, without initializing them in the declaration. That is why `ft_printf` is split into `ft_conv` and the `ft_put*` helpers, and why the work is spread over several files (`ft_printf.c` and `ft_printf_utils.c`). A norm error fails the project even if it works perfectly.",
  hint: "The norm's numbers are 25, 5 and 4; and `for` is forbidden." },
"p5q5": {
  q: "`write` can fail and return -1 (for example with stdout closed: `./a.out >&-`). How should `ft_printf` react so that it returns -1 in that case?",
  opts: ["Always do `len += ft_conv(...)`: the -1 values pile up and the result will be negative anyway.", "Ignore it: `write` on stdout never fails in practice.", "Store `r = ft_conv(...)`; if `r < 0`, call `va_end` and return -1; otherwise `len += r`.", "Call `exit(1)` as soon as `write` returns -1."],
  why: "If you add blindly, a -1 gets mixed with good byte counts: `5 + (-1)` gives 4, which looks like success, and several -1 values give -3 instead of -1. You must check every return value, clean up what needs cleaning (`va_end`) and return -1. `exit` is not allowed and would also kill the user's program. Note: the real `printf` is buffered and almost never sees the failure at the moment it happens; your `ft_printf` writes immediately and does see it.",
  hint: "An error value and a success value cannot be added without checking them first." },
"p5q6": {
  q: "With `ft_printf(\"100%\")` (the format ends in `%`) ASan reports a `heap-buffer-overflow` and the output has an extra `\\0` byte.",
  why: "The condition `*fmt == '%'` does not look at what comes next. With a trailing `%`, `*++fmt` leaves `fmt` pointing at `'\\0'`, `ft_conv` takes it as an unknown conversion (it prints `%` and a NUL) and the next `fmt++` jumps over the terminator: `while (*fmt)` is now reading outside the string. The fix is `if (*fmt == '%' && fmt[1])`. Compiling with `-fsanitize=address` is the quick way to catch this kind of out-of-bounds read.",
  hint: "What is in `fmt[1]` when `%` is the last thing in the string?" },
"p5q7": {
  q: "Negatives reinterpreted: the same `-1` goes through `%d` and `%u`, and `-26` through `%x`. Follow `ft_printf` step by step.",
  why: "`%d` reads a signed `int` and writes `-1` (2 bytes). `%%` consumes no argument and writes a `%`. `%u` reads that same bit pattern as an `unsigned int`: -1 becomes 4294967295 (10 bytes). `%x` does the same with -26, which is `0xffffffe6` (8 digits). Total: 2 + 1 + 10 + 8 = 21 bytes. If your `ft_putunbr` received an `int`, or you converted to a signed `long`, the last two results would come out wrong.",
  hint: "A negative `int` read as `unsigned int` adds 2^32." },
"p5q8": {
  q: "What happens with arguments that do not match the format string? Compare `ft_printf(\"%d %d\\n\", 1)` (too few) with `ft_printf(\"%d\\n\", 1, 2, 3)` (too many).",
  opts: ["Both cases are undefined behavior (UB) according to the C standard.", "If there are too few, `va_arg` returns 0; if there are too many, it is a compile error.", "Both cases return -1 without writing anything.", "Extra arguments are evaluated and ignored (this is defined); too few is UB and `va_arg` reads garbage."],
  why: "The standard says extra arguments are evaluated and ignored, with no problem. If arguments are missing, the second `va_arg` reads a value nobody passed (whatever is in a register or on the stack): that is undefined behavior, it may print garbage or crash. The compiler does not warn you because `ft_printf` is not the libc `printf` (which carries a special attribute so GCC can check the format). Your function does not have to defend against this, but you should know it is the caller's fault.",
  hint: "Think about what `va_arg` reads when there is nothing left to read." },
"p5q9": {
  q: "With `./a.out >&-` (stdout closed) LeakSanitizer reports a \"Direct leak\"; with normal stdout there are no leaks. (`ft_itoa` allocates with `malloc`).",
  why: "If `write` fails, `ft_putstr` returns -1 and the `if (len < 0)` branch exits with `return (-1)` before reaching `free(s)`: the string from `ft_itoa` is lost. A leak is allocated memory that nothing points to anymore. Error paths are where leaks hide best, because normal tests never run them. Fix: free before checking (`free(s)` right after `ft_putstr`) and then `if (len < 0) return (-1)`. The safest approach is not to use `malloc` at all in the mandatory part: with recursion, `ft_putnbr` does not need it.",
  hint: "Look at every `return` and find the one that exits without passing through `free`." },
"p5q10": {
  q: "Put `ft_printf` in order: check the format, walk the string without reading past a trailing `%`, and close the `va_list`. (`ft_conv` is the helper that dispatches on the character; you may name it differently.)",
  why: "First the variables are declared (norm), then `NULL` is rejected with -1 before touching `va_start`, `len` is initialized and the `va_list` is opened. The loop reads `*++fmt` to skip the `%` and pass the conversion character to `ft_conv`; the `fmt[1]` condition avoids reading outside the string with a trailing `%`. It always finishes with `va_end` before the `return`. The two `}` lines and the braces of the `while` look the same: what matters is their position.",
  hint: "`va_start` goes after checking `fmt`; `va_end` goes before returning `len`." },

"p6q1": {
  q: "In a specifier like `%-08.3d`, in what order should your `parse_spec` read the parts?",
  opts: ["Conversion, flags, width and precision.", "Flags, width, `.` with the precision and, last, the conversion character.", "Width, flags, precision and conversion.", "Flags, precision, width and conversion."],
  why: "The format is `%[flags][width][.precision]conversion`, always in that order. In `%-08.3d`: flags `-` and `0`, width 8, precision 3 and conversion `d`. The `0` counts as a flag only if it appears before the width (`%08d`); in `%80d` it is part of the number 80. A `%` followed by flags, width or precision and then another `%` (like `%5%`) is not defined by the standard: glibc ignores the width and writes `%`.",
  hint: "It is read left to right, and the conversion always closes the specifier." },
"p6q2": {
  q: "What does `printf(\"[%-05d]\", 42)` print?",
  opts: ["`[00042]`", "`[42000]`", "`[42   ]`", "`[  042]`"],
  why: "The `-` flag (left-align) and the `0` flag (pad with zeros) conflict, and `-` wins: the padding goes on the right and is made of spaces. Padding with zeros on the right would change the number (42000), so the `0` is ignored. In your `parse_spec` it is enough to store both flags; `emit` is what decides: it only pads with zeros if `zero && !minus`.",
  hint: "Padding with zeros on the right would change the value of the number." },
"p6q3": {
  q: "In `emit`, the precision of an integer is the minimum number of digits: it is padded with zeros on the left (`%.3d` with 7 prints `007`). Fill in the calculation of the zeros.",
  why: "If `prec` digits are requested and the number already has `strlen(dig)`, `prec - strlen(dig)` zeros are missing. Those zeros are written after the prefix (sign, `0x`) and before the digits. The width is computed afterwards, with `total = prefix + zeros + digits`. When there is a precision, the `0` flag is ignored for integers (`%05.3d` with 42 gives `  042`), and `%.0d` with 0 prints no digits.",
  hint: "What is requested minus what is already there." },
"p6q4": {
  q: "Test your command of the flags. Which of these statements about glibc are true?",
  opts: ["`%05d` with 42 prints `00042`.", "`%05.3d` with 42 prints `00042`.", "`%+d` with 0 prints `+0`.", "`% +d` with 5 prints ` 5` (with a space).", "`%#x` with 0 prints `0x0`.", "`%.0d` with 0 prints no digits."],
  why: "`%05d` pads with zeros up to width 5. `%+d` puts `+` on every non-negative number, 0 included. In `%.0d` with 0, precision 0 means \"zero digits\": nothing is printed. The false ones: with a precision the `0` flag is ignored (`%05.3d` gives `  042`); `+` beats space, so `% +d` prints `+5`; and `#` adds `0x` only if the value is non-zero, so `%#x` with 0 prints `0`.",
  hint: "Three rules have an exception: precision vs `0`, `+` vs space and `#` with 0." },
"p6q5": {
  q: "What does `printf(\"[%8.3s]\", \"abcdef\")` print?",
  opts: ["`[  abcdef]`", "`[     abc]`", "`[abc     ]`", "`[00000abc]`"],
  why: "In `%s` the precision is the maximum number of characters: first the string is cut to `abc` (3 bytes) and then width 8 adds 5 spaces on the left (there is no `-`). Order of work: truncate, compute the padding, write. For `%c` and `%s` the width also pads, but always with spaces in the reference (the `0` flag is not defined for them).",
  hint: "The string is cut first and then padded up to the width." },
"p6q6": {
  q: "Width, zeros and sign: follow `ft_printf` with `%08.3d` and `%-+5d`.",
  why: "`%08.3d` with 7: precision 3 gives `007`; since there is a precision, the `0` is ignored and width 8 is filled with 5 spaces: `     007`. `%-+5d` with 42: `+` forces the sign (`+42`, 3 bytes), `-` left-aligns and width 5 adds 2 spaces on the right: `+42  `. Total: `[` + 8 + `|` + 5 + `]` = 16 bytes.",
  hint: "With a precision, the `0` does not count: the padding is made of spaces." },
"p6q7": {
  q: "`ft_printf(\"[%#x]\", 0)` prints `[0x0]` and the real `printf` prints `[0]`. (Reduced version of `conv_unsigned` for `%x` only.)",
  why: "The `#` flag (\"alternate form\") adds `0x` only when the value is non-zero. Here the prefix is set whenever `#` is present, so 0 comes out as `0x0`. The correct condition is `if (sp->hash && v != 0)`. It is a typical case that testers compare against the real `printf`. The same applies to `%#X` with `0X`.",
  hint: "Should `#` do anything with the value 0?" },
"p6q8": {
  q: "Four conversions with flags and precision: `%#x`, `%#X`, `%.3s` and `%6p`.",
  why: "`%#x` with 255: prefix `0x` and `ff` (`0xff`, 4 bytes). `%#X` with 0: `#` adds no prefix with 0, so the output is `0` (1 byte). `%.3s` cuts `abcdef` to `abc`. `%6p` with 31 (`0x1f`, 4 characters) adds 2 spaces on the left: `  0x1f`. In `%p` the `0x` is part of the prefix and counts towards the width. Total: 4 + 1 + 1 + 1 + 3 + 1 + 6 = 17 bytes.",
  hint: "`#` with the value 0 adds no prefix; in `%p` the `0x` counts towards the width." },
"p6q9": {
  q: "Put `parse_spec` in order: it zeroes the struct with the precision set to -1 (\"not requested\"), reads the flags, then the width and finally the precision after the `.`, and returns the pointer to the conversion. (Reduced version with the `-` and `0` flags; with `#`, `+` and space only the flags loop changes.)",
  why: "First everything is initialized (`memset` to 0) and the precision is left at -1, because 0 is a valid value (`%.0d`). The flags are a `while` loop that consumes the `-` and `0` characters; the width comes next, accumulating `n * 10 + digit`. When a `.` is found, the precision becomes 0 and its digits are read (`%.d` is the same as precision 0). Each `*f++` advances while reading; without that progress the loop would never end. It returns `f` pointing at the conversion character, which `ft_printf` reads next.",
  hint: "The precision starts at -1 and only becomes 0 when the `.` appears." }
});

/* ===== PRINTF QUEST · SURVIVAL MODE (EN) =====
   Translations (q, why, hint) of the 9 build exercises in f_sv.js. */
Object.assign(EN.q, {
  "sv_ft_putchar": {
    q: "Build `ft_putchar`: write one character to standard output with `write` and return the number of bytes written. It is the smallest brick of `ft_printf`: everything else ends up calling it.",
    hint: "`write(fd, address, count)`: it needs the address of the data, not the data itself. And standard output is file descriptor 1.",
    why: "`write` takes the ADDRESS of the bytes to write, hence `&c`; passing plain `c` hands it the character's value (97 for 'a') as if it were an address: the compiler rejects it under `-Werror` and, if you forced it, the program would read address 0x61 and crash. With `&c, 2` you ask for two bytes when `c` is only one: GCC warns (\"reading 2 bytes from a region of size 1\") and `-Werror` rejects it; if you compile it anyway a stray stack byte leaks out (ASan reports a `stack-buffer-overflow`) and you return 2 instead of 1, so the total of `ft_printf` comes out wrong. And `write(0, ...)` writes to standard input (stdin): on an interactive terminal it often works by accident, but with redirected output (`./a.out | cat`, or the moulinette) nothing arrives and `write` returns -1. Standard output is descriptor 1."
  },
  "sv_ft_putstr": {
    q: "Build `ft_putstr`: write a string with ONE single `write` call and return the bytes written. If the string is NULL it must print `(null)`, like glibc does for `%s`. Compute the length yourself (there is no `strlen`).",
    hint: "The length loop stops at the `'\\0'`. The NULL case is fixed BEFORE counting, by changing what `s` points to.",

      steps[steps.length - 1].after = { tok: t, argn: argn, out: out };
    }
    const total = out.length;
    const ro = [total];
    [total - 1, total + 1, toks.filter((x) => SPEC_RE.test(x)).length, q.fmt.length, total + 2].forEach((c) => { if (c >= 0 && ro.indexOf(c) < 0 && ro.length < 4) ro.push(c); });

  function renderSim() {

    if (!m.done) {
      h += '<div class="simbox"><p class="simq">' + tr("simStepOf", m.idx + 1, m.steps.length) + " · " + esc(simLabel(stepObj)) + "</p>" +
        '<div class="opts">' + stepObj.opts.map((o, i) => {
          let cls = "opt";

          return '<button class="' + cls + '" data-si="' + i + '"' + (m.pending !== null ? " disabled" : "") + '><span class="key">' + (i + 1) + "</span><span>" + esc(simVal(stepObj, o)) + "</span></button>";
        }).join("") + "</div>";
      if (m.pending !== null) {

          '<div class="actions"><button class="btn" id="simnext">' + (m.idx + 1 >= m.steps.length ? tr("check") : tr("simNext")) + "</button></div>";

        const s = m.steps[l.i];

  /* ---- pantallas ---- */

      if (hb && !hb.disabled) hb.click();

  });

  /* ---- arranque ---- */
  $("modes").addEventListener("click", goModes);
  const lb = $("lang");
  if (lb) lb.addEventListener("click", () => {
    LANG = LANG === "es" ? "en" : "es";
    try { localStorage.setItem(LANG_KEY, LANG); } catch (e) { /* sin almacenamiento */ }
    applyStatic();
    render();
    document.dispatchEvent(new Event("langchange"));
  });
  loadLocal();
  applyStatic();
  render();
  initStore();
})();

    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t, dur, gain, hp) {
    const s = ctx.createBufferSource(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    s.buffer = noiseBuf;
    f.type = "highpass"; f.frequency.value = hp;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.16);
  }

  /* pista tensa del survival: pulso grave, latido, alarma aguda y subida cromática */
  const TL = [
    [[0, 76, 1], [1, 75, 1], [2, 76, 1], [3, 75, 1], [4, 76, 2], [6, 71, 2], [8, 72, 1], [9, 71, 1], [10, 72, 1], [11, 71, 1], [12, 72, 2], [14, 67, 2]],
    [[0, 76, 1], [1, 75, 1], [2, 76, 1], [3, 75, 1], [4, 76, 2], [6, 71, 2], [8, 72, 1], [9, 71, 1], [10, 72, 1], [11, 71, 1], [12, 77, 2], [14, 76, 2]],
    [[0, 77, 1], [1, 76, 1], [2, 77, 1], [3, 76, 1], [4, 77, 2], [6, 72, 2], [8, 73, 1], [9, 72, 1], [10, 73, 1], [11, 72, 1], [12, 73, 2], [14, 68, 2]],
    []
  ];
  for (let k = 0; k < 16; k++) TL[3].push([k, 64 + k, 1]);
  function playTense(i, t) {
    const STEP = stepLen();
    const bar = Math.floor(i / 16), s = i % 16;
    const root = bar === 2 ? 41 : 40;
    if (s % 2 === 0) tone("sawtooth", mtof(root + (s % 8 === 6 ? 12 : 0)), t, STEP * 1.5, 0.15);
    if (s === 0 || s === 3 || s === 8 || s === 11) kick(t);
    if (s === 4 || s === 12) noise(t, 0.1, 0.13, 1200);
    noise(t, 0.03, s % 2 ? 0.055 : 0.03, 7000);
    TL[bar].forEach((n) => { if (n[0] === s) tone("square", mtof(n[1]), t, STEP * n[2] * 0.9, 0.07); });
    if (bar < 3 ? (s === 0 || s === 8) : s % 2 === 0) tone("square", mtof(88), t, STEP * 0.45, 0.035);
  }

  function playStep(i, t) {
    if (track === "tense") { playTense(i, t); return; }
    const STEP = stepLen();
    const bar = Math.floor(i / 16), s = i % 16;
    const name = bar === 7 && s >= 8 ? "E" : PROG[bar];
    const root = CH[name][0], tones = CH[name][1];
    if (s % 2 === 0) tone("triangle", mtof(root + (s % 4 === 2 ? 12 : 0)), t, STEP * 1.8, 0.32);
    tone("square", mtof(tones[[0, 1, 2, 1][s % 4]] + 12), t, STEP * 0.9, 0.035);
    LEAD[bar].forEach((n) => { if (n[0] === s) tone("square", mtof(n[1]), t, STEP * n[2] * 0.95, 0.07); });
    if (s === 0 || s === 8) kick(t);
    if (s === 4 || s === 12) noise(t, 0.12, 0.12, 1500);
    if (s % 4 === 2) noise(t, 0.04, 0.05, 6000);
  }

  function tick() {
    while (nextTime < ctx.currentTime + 0.25) {
      playStep(step, nextTime);
      nextTime += stepLen();
      step = (step + 1) % (track === "tense" ? TSTEPS : STEPS);
    }
  }

  function paint() {
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = tr("music", on);
  }
  function remember(v) { try { localStorage.setItem(KEY, v ? "on" : "off"); } catch (e) { /* sin almacenamiento */ } }

  function start() {
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.6;
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (ctx.state === "suspended") ctx.resume();
      step = 0;
      nextTime = ctx.currentTime + 0.08;
      tick();
      timer = setInterval(tick, 50);
      on = true;
    } catch (e) { on = false; ctx = null; }
    paint();
  }
  function stop() {
    clearInterval(timer);
    timer = null;
    if (ctx) { try { ctx.close(); } catch (e) { /* ya cerrado */ } }
    ctx = null; on = false;
    paint();
  }

  /* si la música estaba activada la última vez, arranca en el primer gesto */
  function arm(e) {
    if (btn.contains(e.target)) return;
    if (e.type === "keydown" && !(e.key === "Enter" || e.key === " " || /^[1-9a-zA-Z]$/.test(e.key))) return;
    disarm();
    if (!on) { start(); }
  }
  function disarm() {
    document.removeEventListener("pointerdown", arm, true);
    document.removeEventListener("keydown", arm, true);
  }

  btn.addEventListener("click", () => {
    disarm();
    if (on) { stop(); remember(false); } else { start(); remember(true); }
  });

  /* en pestaña oculta se calla; al volver, continúa */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && on) { resumeAfterHidden = true; stop(); }
    else if (!document.hidden && resumeAfterHidden) { resumeAfterHidden = false; start(); }
  });

  /* el motor avisa del cambio de pista; la tensa va más rápido según el avance */
  document.addEventListener("trackchange", (e) => {
    const d = e.detail || {};
    const changed = d.track !== track;
    track = d.track === "tense" ? "tense" : "calm";
    tempo = track === "tense" ? 148 + 52 * (d.progress || 0) : 118;
    if (changed) {
      step = 0;
      if (ctx) nextTime = ctx.currentTime + 0.05;
    }
  });
  document.addEventListener("langchange", paint);
  paint();
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* sin almacenamiento */ }
  if (saved === "on") {
    document.addEventListener("pointerdown", arm, true);
    document.addEventListener("keydown", arm, true);
  }
})();

(function () {
  "use strict";
  const AC = window.AudioContext || window.webkitAudioContext;
  const KEY = "printf-quest-sfx";
  const btn = document.getElementById("sfx");
  let ctx = null, out = null, nb = null, enabled = true;
  try { if (localStorage.getItem(KEY) === "off") enabled = false; } catch (e) { /* sin almacenamiento */ }
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function paint() {
    if (!btn) return;
    btn.setAttribute("aria-pressed", enabled ? "true" : "false");
    btn.textContent = tr("sfx", enabled);
  }
  function ensure() {
    if (!AC) return false;
    if (!ctx) {
      try {
        ctx = new AC();
        out = ctx.createGain(); out.gain.value = 0.5; out.connect(ctx.destination);
        nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.4), ctx.sampleRate);
        const d = nb.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ctx = null; return false; }
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }
  /* f0 -> f1 en dur segundos, empezando en t0 */
  function beep(type, f0, f1, t0, dur, gain) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(out);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function hiss(t0, dur, gain, hp) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = nb; f.type = "highpass"; f.frequency.value = hp;
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t0); s.stop(t0 + dur + 0.02);
  }
  function seq(type, notes, t0, step, len, gain) {
    notes.forEach((m, i) => beep(type, mtof(m), mtof(m), t0 + i * step, len, gain));
  }

  const FX = {
    click(t) { beep("square", 1100, 1500, t, 0.035, 0.09); },
    key(t) { beep("square", 700, 700, t, 0.025, 0.07); },
    ok(t) { seq("square", [72, 76, 79, 84], t, 0.075, 0.12, 0.12); },
    bad(t) { beep("sawtooth", 200, 70, t, 0.32, 0.14); hiss(t, 0.12, 0.08, 800); },
    clear(t) {
      seq("square", [67, 72, 76, 79, 76, 79, 84], t, 0.11, 0.16, 0.11);
      seq("triangle", [48, 48, 52, 55, 52, 55, 60], t, 0.11, 0.2, 0.25);
    },
    segfault(t) {
      hiss(t, 0.7, 0.2, 300);
      beep("sawtooth", 330, 40, t, 0.8, 0.14);
      beep("square", 110, 30, t + 0.1, 0.7, 0.1);
    },
    final(t) {
      seq("square", [60, 64, 67, 72, 67, 72, 76, 79, 76, 84], t, 0.12, 0.2, 0.1);
      seq("triangle", [36, 36, 43, 48, 43, 48, 52, 55, 52, 60], t, 0.12, 0.25, 0.28);
    }
  };

  function play(name) {
    if (!enabled || !FX[name] || !ensure()) return;
    try { FX[name](ctx.currentTime + 0.01); } catch (e) { /* audio no disponible */ }
  }
  window.SFX = { play };

  /* clic en cualquier botón o elemento interactivo */
  document.addEventListener("click", (e) => {
    const el = e.target.closest && e.target.closest("button, [data-i], .sector, a, [role=button]");
    if (!el || el.disabled) return;
    if (el.id === "sfx") return;
    play("click");
  }, true);

  if (btn) {
    if (!AC) btn.hidden = true;
    btn.addEventListener("click", () => {
      enabled = !enabled;
      try { localStorage.setItem(KEY, enabled ? "on" : "off"); } catch (e) { /* sin almacenamiento */ }
      paint();
      if (enabled) play("ok");
    });
    document.addEventListener("langchange", paint);
    paint();
  }
})();
