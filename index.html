<style>
/* Concepto: monitor de fósforo ámbar. Una terminal central con la pregunta,
   mapa de sectores arriba e inventario de funciones dominadas a un lado. */
:root {
  --bg: #120f0a;
  --panel: #1a150d;
  --panel-2: #221b10;
  --line: #3b2f1a;
  --fg: #ffcf7a;
  --dim: #9c7c43;
  --faint: #5d4a28;
  --cyan: #7fd6c8;
  --ok: #a6e36b;
  --bad: #ff7058;
  --ink: #120f0a;
  --font-display: "VT323", "Courier New", monospace;
  --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 20px 40px;
  background-image: repeating-linear-gradient(0deg, rgba(255, 207, 122, .035) 0 1px, transparent 1px 3px);
}
.app { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
::selection { background: var(--fg); color: var(--ink); }

/* barra de título */
.titlebar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  border: 1px solid var(--line); background: var(--panel); padding: 8px 14px;
}
.brand { font-family: var(--font-display); font-size: 30px; line-height: 1; letter-spacing: .06em; text-shadow: 0 0 10px rgba(255, 207, 122, .45); }
.brand small { font-size: 18px; color: var(--dim); letter-spacing: .04em; margin-left: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.lives b { letter-spacing: .15em; color: var(--bad); }
.mbtn {
  background: none; border: 1px solid var(--line); color: var(--dim); padding: 0 10px; font-size: 12px; line-height: 1.7;
  text-transform: uppercase; letter-spacing: .1em; font-weight: 500;
}
.mbtn span.on { color: var(--fg); font-weight: 600; }
.mbtn:hover { border-color: var(--fg); color: var(--fg); }
.mbtn[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); }

/* mapa de sectores */
.map { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.sector {
  text-align: left; border: 1px solid var(--line); background: var(--panel); padding: 10px 10px 8px;
  display: grid; gap: 2px; align-content: start; min-width: 0;
}
.sector .hex { font-family: var(--font-display); font-size: 20px; color: var(--dim); line-height: 1; }
.sector .nm { font-weight: 600; font-size: 12px; letter-spacing: .08em; overflow-wrap: anywhere; }
.sector .pg { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.sector .bar { height: 4px; background: var(--line); margin-top: 6px; }
.sector .bar i { display: block; height: 100%; width: 0; background: var(--fg); }
.sector:hover:not(:disabled) { border-color: var(--fg); }
.sector[aria-current="true"] { border-color: var(--fg); background: var(--panel-2); box-shadow: 0 0 0 1px var(--fg) inset; }
.sector:disabled { cursor: not-allowed; opacity: .45; }
.sector.done .bar i { background: var(--ok); }
.sector.done .hex { color: var(--ok); }

/* zona principal */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
.term { border: 1px solid var(--fg); background: var(--panel); box-shadow: 0 0 24px rgba(255, 207, 122, .08); min-width: 0; }
.term-head {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
  background: var(--fg); color: var(--ink); padding: 4px 14px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
}
.term-body { padding: 18px 18px 20px; display: grid; gap: 16px; min-width: 0; }
.stars { letter-spacing: .15em; }
.tag { font-size: 12px; color: var(--cyan); letter-spacing: .06em; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .04em; }
h1 { font-size: 42px; line-height: 1; }
h2 { font-size: 28px; line-height: 1.1; }
p { margin: 0; }
.qtext { font-size: 15px; max-width: 70ch; }
.qtext code, .explain code, .hint code, .opt code { color: var(--cyan); font-family: var(--font-body); }
.prompt { color: var(--dim); }
.prompt::before { content: "> "; color: var(--fg); }

/* código */
pre.code {
  margin: 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line);
  overflow-x: auto; font-size: 13px; line-height: 1.55; tab-size: 4; max-width: 100%;
}
pre.code .k { color: var(--cyan); }
pre.code .t { color: #f0a35e; }
pre.code .s { color: var(--ok); }
pre.code .n { color: #e6c0ff; }
pre.code .c { color: var(--faint); }
pre.code .b { color: var(--fg); background: var(--panel-2); border-bottom: 2px solid var(--fg); padding: 0 .5ch; }
.lines { display: grid; border: 1px solid var(--line); background: var(--bg); overflow-x: auto; }
.line {
  display: grid; grid-template-columns: 34px 1fr; text-align: left; background: transparent; border: 0;
  border-left: 3px solid transparent; padding: 0 10px 0 0; font-size: 13px; line-height: 1.7; white-space: pre; min-width: max-content; width: 100%;
}
.line .no { color: var(--faint); text-align: right; padding-right: 10px; user-select: none; font-variant-numeric: tabular-nums; }
.line:hover:not(:disabled) { background: var(--panel-2); }
.line.picked { border-left-color: var(--fg); background: var(--panel-2); }
.line.right { border-left-color: var(--ok); background: rgba(166, 227, 107, .12); }
.line.wrong { border-left-color: var(--bad); background: rgba(255, 112, 88, .12); }
.line:disabled { cursor: default; }

/* en táctil no hay teclado: fuera las ayudas de teclas */
@media (pointer: coarse), (max-width: 700px) {
  .actions .kbd, .kbd-inline { display: none; }
}

/* tipo build */
.bhead { margin: 14px 0 6px; color: var(--dim); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.pool { display: grid; gap: 4px; overflow-x: auto; }
.piece {
  text-align: left; background: var(--bg); border: 1px solid var(--line); padding: 2px 12px; font-size: 13px; line-height: 1.7;
  white-space: pre; min-width: max-content; width: 100%;
}
.piece:hover:not(:disabled) { border-color: var(--fg); background: var(--panel-2); }
.piece:disabled { opacity: .22; cursor: default; }
.built .empty { margin: 0; padding: 12px 14px; color: var(--faint); font-size: 13px; }

/* opciones */
.opts { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; gap: 4px; align-items: start; text-align: left; width: 100%;
  background: var(--bg); border: 1px solid var(--line); padding: 8px 12px; min-width: 0; overflow-wrap: anywhere;
}
.opt .key { color: var(--dim); font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--fg); }
.opt.picked { border-color: var(--fg); background: var(--panel-2); }
.opt.picked .key { color: var(--fg); }
.opt.right { border-color: var(--ok); background: rgba(166, 227, 107, .12); }
.opt.wrong { border-color: var(--bad); background: rgba(255, 112, 88, .12); }
.opt.missed { border-style: dashed; border-color: var(--ok); }
.opt:disabled { cursor: default; }
.multi-note { font-size: 12px; color: var(--dim); }

.fillrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fillrow label { color: var(--dim); }
.fillrow input {
  font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 6px 10px; min-width: 0; flex: 1 1 200px; max-width: 360px;
  caret-color: var(--fg);
}
.fillrow input:disabled { border-color: var(--line); }
.fillrow input.right { border-color: var(--ok); color: var(--ok); }
.fillrow input.wrong { border-color: var(--bad); color: var(--bad); }

/* botones */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 4px 0 14px; }
.mode { border: 1px solid var(--line); background: var(--bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.mode h3 { margin: 0; font-size: 22px; line-height: 1.1; color: var(--fg); }
.mode p { margin: 0; font-size: 13px; line-height: 1.5; }
.mode .meta { color: var(--dim); }
.mode .btn { align-self: flex-start; margin-top: auto; }
@media (max-width: 700px) { .modes { grid-template-columns: 1fr; } }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  background: transparent; border: 1px solid var(--fg); padding: 7px 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px;
}
.btn:hover:not(:disabled) { background: var(--fg); color: var(--ink); }
.btn:disabled { border-color: var(--line); color: var(--faint); cursor: not-allowed; }
.btn.ghost { border-color: var(--line); color: var(--dim); }
.btn.ghost:hover:not(:disabled) { border-color: var(--dim); background: transparent; color: var(--fg); }
.kbd { font-size: 11px; color: var(--dim); }

/* feedback */
.result { border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; background: var(--bg); }
.result.ok { border-color: var(--ok); }
.result.bad { border-color: var(--bad); }
.verdict { font-family: var(--font-display); font-size: 26px; line-height: 1; letter-spacing: .05em; }
.result.ok .verdict { color: var(--ok); }
.result.bad .verdict { color: var(--bad); }
.explain { max-width: 70ch; }
.rel { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12px; color: var(--dim); }
.chip {
  font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); color: var(--dim); background: transparent; line-height: 1.6;
}
.chip.on { border-color: var(--fg); color: var(--fg); }
.chip.link { border-color: var(--cyan); color: var(--cyan); }
.hint { color: var(--dim); font-size: 13px; border-left: 2px solid var(--line); padding-left: 10px; }

/* inventario */
.inv { border: 1px solid var(--line); background: var(--panel); min-width: 0; }
.inv-head { padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; }
.inv-body { padding: 12px 14px 14px; display: grid; gap: 14px; }
.inv-group { display: grid; gap: 6px; }
.inv-group h3 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fn { font-size: 12px; padding: 1px 8px; border: 1px dashed var(--faint); color: var(--faint); background: transparent; }
.fn.got { border: 1px solid var(--fg); color: var(--fg); }
.fn.sel { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.depinfo { border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; color: var(--dim); min-height: 3.2em; }
.depinfo b { color: var(--fg); font-weight: 600; }

/* pantallas de texto */
.boot { font-size: 13px; color: var(--dim); display: grid; gap: 2px; }
.boot .ok { color: var(--ok); }
.final-score { font-family: var(--font-display); font-size: 64px; line-height: 1; text-shadow: 0 0 14px rgba(255, 207, 122, .5); }
.caret::after { content: "█"; animation: blink 1.1s steps(1) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }
.status-line { font-size: 12px; color: var(--dim); }
.foot { font-size: 11px; color: var(--faint); text-align: center; }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .map { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 460px) {
  body { font-size: 13px; }
  .term-body { padding: 14px 12px 16px; }
  h1 { font-size: 34px; }
  .map { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .caret::after { animation: none; }
}
/* simulador paso a paso */
.sim { display: grid; gap: 10px; margin: 6px 0 12px; }
.simbox { border: 1px solid var(--line); background: var(--panel); padding: 8px 12px; display: grid; gap: 6px; }
.simbox h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .06em; color: var(--dim); }
.simrow { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.simrow .k { color: var(--dim); }
.cells { display: flex; flex-wrap: wrap; gap: 2px; }
.cell { min-width: 22px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; }
.cell.nl { color: var(--cyan); }
.cell.used { opacity: .35; }
.cell.next { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg) inset; }
.stashv { color: var(--cyan); word-break: break-all; }
.stashv.null { color: var(--faint); }
.simlog { display: grid; gap: 2px; font-size: 13px; max-height: 190px; overflow-y: auto; }
.simlog .g { color: var(--ok); } .simlog .x { color: var(--bad); }
.simlog .cn { color: var(--dim); }
.simq { font-weight: 600; }
.simfb { border-left: 3px solid var(--line); padding: 6px 10px; margin: 0; }
.simfb.ok { border-left-color: var(--ok); } .simfb.bad { border-left-color: var(--bad); }
</style>

<script>
/* ===== PRINTF QUEST · núcleo de datos ===== */
const SECTORS = [
  { n: 1, hex: "0x01", name: "FORMATO", blurb: "Qué es printf, qué recibe, qué devuelve y qué pide el subject. Desde cero." },
  { n: 2, hex: "0x02", name: "VARIÁDICAS", blurb: "Los tres puntos, va_list y los macros va_start, va_arg y va_end." },
  { n: 3, hex: "0x03", name: "CONVERSIONES", blurb: "%c %s %d %i %u %%: escribir con write y contar los bytes." },

  { n: 6, hex: "0x06", name: "BONUS", blurb: "Flags - 0 # + espacio, ancho y precisión." }
];
const LIBC = [];
const DEPS = {
  ft_printf: ["ft_conv", "va_start", "va_arg", "va_end", "write"],
  ft_conv: ["ft_putchar", "ft_putstr", "ft_putnbr", "ft_putunbr", "ft_putptr"],
  ft_putchar: ["write"],
  ft_putstr: ["write"],
  ft_putnbr: ["ft_putchar", "ft_putunbr"],
  ft_putunbr: ["ft_putchar"],
  ft_putptr: ["ft_putstr", "ft_putunbr"],
  parse_spec: [],
  conv_int: ["emit"],
  emit: ["write"]
};
const L = (s) => s.split("\n");
const Q = [];
const SURV = [];
const SURV_ORDER = ["ft_putchar", "ft_putstr", "ft_putunbr", "ft_putnbr", "ft_putptr", "ft_conv", "ft_printf", "parse_spec", "conv_int"];
const survList = () => SURV_ORDER.map((fn) => SURV.find((q) => q.fn === fn)).filter(Boolean);

/* órdenes válidos de una pregunta build: sol + permutaciones permitidas (perm) + alts explícitos */
function expandAlts(q) {
  if (q.type !== "build" || q.accept) return;
  const perms = (n) => {
    if (n <= 1) return [[0]];
    const out = [];
    perms(n - 1).forEach((p) => { for (let i = 0; i <= p.length; i++) out.push(p.slice(0, i).concat(n - 1, p.slice(i))); });
    return out;
  };
  let outs = [q.sol.slice()];
  (q.perm || []).forEach((group) => {
    const blocks = group.map((b) => q.sol.slice(b[0], b[1] + 1));
    const lo = Math.min.apply(null, group.map((b) => b[0])), hi = Math.max.apply(null, group.map((b) => b[1]));
    const next = [];
    outs.forEach((o) => perms(blocks.length).forEach((ord) => {
      let mid = [];
      ord.forEach((i) => { mid = mid.concat(blocks[i]); });
      next.push(o.slice(0, lo).concat(mid, o.slice(hi + 1)));
    }));
    outs = next;
  });
  const seen = {}, all = [];
  outs.concat(q.alts || []).forEach((a) => { const k = a.join("\n"); if (!seen[k]) { seen[k] = 1; all.push(a); } });
  q.accept = all;
}
/* ===== Idiomas: sectores en inglés ===== */
const EN = {
  sectors: [
    { name: "FORMAT", blurb: "What printf is, what it takes, what it returns and what the subject asks for. From zero." },
    { name: "VARIADICS", blurb: "The three dots, va_list and the va_start, va_arg and va_end macros." },
    { name: "CONVERSIONS", blurb: "%c %s %d %i %u %%: writing with write and counting bytes." },

    { name: "LIMITS", blurb: "NULL, INT_MIN, write errors, output order and the moulinette's traps." },

};

{ id:"p1q1", s:1, st:1, fn:"printf", type:"choice",
  q:"¿Qué hace `printf`, a grandes rasgos?",
  opts:[
    "Lee datos del teclado y los guarda en las variables que le indiques",
    "Escribe por la salida estándar un texto construido a partir de una cadena de formato y de los argumentos que le pases",
    "Copia una cadena en otra, carácter a carácter, hasta el `\\0`",

  ], ans:1,
  why:"`printf` recibe una cadena de formato (un molde con texto y marcadores) y, después, los valores que rellenan esos marcadores. Construye el texto final y lo escribe en la salida estándar (stdout). Lo que lee del teclado es `scanf`, y copiar cadenas es trabajo de `strcpy`.",
  hint:"Piensa en el nombre: print + formatted (impresión con formato).", rel:["format"] },

{ id:"p1q2", s:1, st:1, fn:"format", type:"choice",
  q:"En `printf(\"Tengo %d años\", 36)`, ¿qué es `%d`?",
  opts:[
    "Texto literal: se imprime tal cual, con el signo de porcentaje incluido",
    "El nombre de una variable llamada `d`",
    "Un comentario que el compilador ignora",
    "Una conversión (conversion specifier): un marcador que se sustituye por el siguiente argumento, interpretado como `int` en base 10"
  ], ans:3,
  why:"Dentro de la cadena de formato, `%` abre una conversión: un marcador que dice «aquí va un argumento y trátalo así». `d` significa entero con signo en decimal. Todo lo demás (`Tengo ` y ` años`) es texto literal y se copia sin cambios. Por eso la salida es `Tengo 36 años`.",
  hint:"Si `%d` se imprimiera tal cual, el 36 no tendría dónde ir.", rel:["printf"] },

{ id:"p1q3", s:1, st:1, fn:"format", type:"sim",

{ id:"p2q1", s:2, st:1, fn:"va_list", type:"choice",
  q:"En `int ft_printf(const char *fmt, ...)`, ¿qué son los `...`?",
  opts:[

    "Un marcador de «código por escribir» que el compilador rellena"
  ], ans:1,
  why:"Los `...` indican una función variádica (variadic): acepta cero o más argumentos tras los fijos. C no guarda cuántos se pasaron ni de qué tipo, así que la propia función debe deducirlo. En `printf` esa información está en la cadena de formato: cada `%` anuncia un argumento y su tipo. Para recorrerlos se usa `va_list` junto con los macros de `<stdarg.h>`.",
  hint:"Si C guardara el número de argumentos, `printf(\"%d\")` sin argumento no sería un problema.", rel:["va_start"] },

{ id:"p2q2", s:2, st:1, fn:"va_start", type:"choice",
  q:"¿Qué se pasa como segundo argumento de `va_start(ap, ____)`?",

  hint:"Los macros no ven los `...` por nombre; parten del último parámetro que sí lo tiene.", rel:["va_list"] },

{ id:"p2q3", s:2, st:1, fn:"va_arg", type:"fill",

  hint:"El tipo de un `%d` en C.", rel:["va_list"] },

{ id:"p2q4", s:2, st:1, fn:"va_arg", type:"choice",
  q:"Tras `a = va_arg(ap, int);`, ¿qué obtiene `b = va_arg(ap, int);` justo a continuación?",

  ], ans:2,
  why:"`ap` funciona como un cursor: cada `va_arg` devuelve el argumento actual y avanza al siguiente. No hay forma de «volver atrás» con la misma lista. Por eso las conversiones deben leer exactamente un `va_arg` cada una, en el orden del formato. Para recorrer dos veces existe `va_copy`.",
  hint:"Piensa en un cursor que sólo avanza.", rel:["va_end"] },

{ id:"p2q5", s:2, st:2, fn:"va_end", type:"multi",
  q:"¿Qué afirmaciones sobre `va_end` y `va_copy` son ciertas?",
  opts:[
    "Toda `va_list` iniciada con `va_start` (o `va_copy`) debe cerrarse con `va_end` antes de que la función retorne",

  why:"El estándar exige llamar a `va_end` por cada `va_start` o `va_copy`: en algunas plataformas no hace nada, pero en otras libera recursos, y omitirlo es comportamiento indefinido. No libera tus argumentos (esos viven en la pila de quien llamó). `va_copy` clona el cursor en su estado actual, útil si necesitas medir primero y escribir después; la copia también necesita su propio `va_end`.",
  hint:"Una va_list se abre y se cierra, aunque ya no queden argumentos.", rel:["va_start"] },

{ id:"p2q6", s:2, st:2, fn:"promotion", type:"choice",
  q:"¿Por qué `%c` se lee con `va_arg(ap, int)` y no con `va_arg(ap, char)`?",
  opts:[

    "Porque `write` exige recibir un `int`",

  ], ans:3,
  why:"Para los `...` no hay prototipo que diga el tipo esperado, así que C aplica las promociones por defecto (default argument promotions): `char` y `short` suben a `int`, y `float` sube a `double`. Quien llama ya ha enviado un `int`; leer un `char` no coincide con lo enviado y gcc avisa: «`char` is promoted to `int` when passed through `...`». Se lee `int` y luego se castea: `(char)va_arg(ap, int)`.",
  hint:"El valor que llega ya ha cambiado de tipo antes de entrar en la función.", rel:["va_arg"] },

{ id:"p2q7", s:2, st:2, fn:"promotion", type:"multi",
  q:"¿Cuáles de estos tipos cambian al pasarlos como argumento variádico? Marca todos los que se promueven.",

    "`char`",
    "`short`",
    "`float`",
    "`int`",
    "`char *`",
    "`long`"
  ], ans:[0,1,2],

  hint:"Los que son más pequeños que `int`, más `float`.", rel:["va_arg"] },

{ id:"p2q8", s:2, st:2, fn:"va_arg", type:"sim", typeq:true,
  q:"Recorre la llamada y decide qué tipo lee `va_arg` en cada conversión.",
  fmt:"%c=%d, %s", args:["x", -5, "hi"],
  why:"`%c` lee un `int` (promoción de `char`) y lo escribe como carácter; `%d` lee `int`; `%s` lee `char *`. Cada `va_arg` avanza al siguiente argumento, y el texto literal (`=`, `, `) no consume nada. Total: `x=-5, hi`, 8 bytes.",

{ id:"p2q9", s:2, st:2, fn:"va_list", type:"build",
  q:"Ordena el esqueleto del bucle principal de `ft_printf`: abre la lista de argumentos, recorre el formato, cierra la lista y devuelve los bytes escritos. Ojo, hay piezas que no hacen falta. (Aquí `ft_conv` recibe el carácter y la `va_list`; el alumno puede llamar distinto a sus auxiliares.)",
  sol:[
    "int     ft_printf(const char *fmt, ...)",
    "{",
    "    va_list ap;",
    "    int     len;",
    "    len = 0;",
    "    va_start(ap, fmt);",
    "    while (*fmt)",
    "    {",
    "        if (*fmt == '%' && fmt[1])",
    "            len += ft_conv(*++fmt, ap);",
    "        else",
    "            len += ft_putchar(*fmt);",
    "        fmt++;",
    "    }",
    "    va_end(ap);",
    "    return (len);",
    "}"
  ],
  extra:["    va_start(ap, ...);", "    va_end(fmt);", "    va_copy(ap, fmt);"],
  perm:[[[2,2],[3,3]], [[4,4],[5,5]]],
  why:"Primero se declaran `ap` y el contador; luego `va_start(ap, fmt)` ancla la lista en el último parámetro fijo. El bucle copia el texto literal y, ante un `%` seguido de algo, delega en `ft_conv`, que consume el argumento con `va_arg`. Al final, `va_end(ap)` cierra la lista y se devuelve el total. `va_start(ap, ...)` no nombra el último parámetro fijo, `va_end(fmt)` cierra `fmt` en vez de `ap`, y `va_copy` no hace falta aquí.",
  hint:"`va_start` va después de declarar y antes de leer; `va_end` va antes del `return`.", rel:["va_start","va_end"] },

{ id:"p2q10", s:2, st:2, fn:"va_arg", type:"choice",
  q:"Llamas a `ft_printf(\"%s\\n\", 42);`. ¿Qué ocurre?",
  opts:[

  hint:"¿Quién comprueba que el tipo del argumento coincide con el del formato?", rel:["promotion"] }

{ id: "p3q1", s: 3, st: 2, fn: "ft_putchar", type: "choice",
  q: "`ft_putchar` hace `write(1, &c, 1)`. Si todo va bien, ¿qué devuelve `ft_putchar('A')`?",
  opts: ["0, porque escribir no produce ningún resultado que devolver", "El valor de `c`, es decir 65", "1: el número de bytes que escribió `write`", "-1, que es la marca de «todo correcto»"],
  ans: 2,
  why: "`write` devuelve cuántos bytes ha escrito (aquí 1) o -1 si falla. `ft_putchar` devuelve ese mismo valor porque `ft_printf` necesita sumar los bytes de cada pieza para devolver el total. Todas las funciones `ft_put...` siguen esta convención: devuelven bytes escritos.",
  hint: "Piensa para qué quiere `ft_printf` el número que devuelve cada función auxiliar.",
  rel: ["ft_conv"] },

{ id: "p3q2", s: 3, st: 2, fn: "ft_putstr", type: "choice",
  q: "En Linux, ¿qué hace `printf(\"%s\", NULL)` de la libc y cuánto devuelve? Tu `ft_printf` debe copiarlo.",
  opts: ["Segfault: nunca se debe pasar NULL a `%s`", "Imprime `NULL` y devuelve 4", "Imprime `(null)` y devuelve 6", "No imprime nada y devuelve 0"],
  ans: 2,
  why: "El estándar dice que es comportamiento indefinido (UB: el compilador no promete nada), pero glibc imprime `(null)`, que son 6 bytes, y la moulinette compara contra eso. Por eso `ft_putstr` empieza con `if (!s) s = \"(null)\";` antes de medir la cadena: así el resto del código no distingue casos.",
  hint: "Cuenta los caracteres de «(null)», paréntesis incluidos.",
  rel: ["ft_conv"] },

{ id: "p3q3", s: 3, st: 2, fn: "ft_putstr", type: "build",
  q: "Ordena `ft_putstr`: sustituye NULL por `(null)`, mide la cadena y la escribe con un único `write`, devolviendo los bytes escritos.",
  sol: [
    "int     ft_putstr(const char *s)",
    "{",
    "    int     len;",
    "    if (!s)",
    "        s = \"(null)\";",
    "    len = 0;",
    "    while (s[len])",
    "        len++;",
    "    return (write(1, s, len));",
    "}"
  ],
  extra: ["    return (write(1, &s, len));", "    while (*s)"],
  perm: [[[3, 4], [5, 5]]],
  why: "Primero se arregla `s` (si no, medir NULL revienta), luego se cuenta la longitud (`len = 0` y bucle) y al final un solo `write(1, s, len)`: es mucho más rápido que un `write` por carácter y devuelve directamente los bytes. `&s` sería la dirección del puntero, no de la cadena. Y `while (*s)` avanzaría `s` y perderías el inicio. Tu auxiliar puede llamarse distinto; lo importante es la estructura.",
  hint: "El NULL se corrige antes de leer la cadena; `write` va lo último." ,
  rel: ["ft_conv"] },

{ id: "p3q4", s: 3, st: 3, fn: "ft_putnbr", type: "build",
  q: "Ordena `ft_putnbr` recursivo (versión autónoma, sin `ft_putunbr`). Debe imprimir bien `INT_MIN` y devolver los bytes escritos.",
  sol: [
    "int     ft_putnbr(long n)",
    "{",
    "    int     len;",
    "    len = 0;",
    "    if (n < 0)",
    "    {",
    "        len += ft_putchar('-');",
    "        n = -n;",
    "    }",
    "    if (n > 9)",
    "        len += ft_putnbr(n / 10);",
    "    len += ft_putchar('0' + n % 10);",
    "    return (len);",
    "}"
  ],
  extra: ["int     ft_putnbr(int n)", "    len += ft_putchar(n % 10);"],
  perm: [[[6, 6], [7, 7]]],
  why: "Con `long` (64 bits) el valor `-n` de -2147483648 es 2147483648 y cabe; con `int` sería desbordamiento (overflow). La recursión imprime primero los dígitos altos (`n / 10`) y al volver el último (`n % 10`); sin `'0' +` escribirías el byte 3 en vez del carácter `'3'`. En la referencia `ft_putnbr` delega en `ft_putunbr` (sector 4); esta versión es equivalente.",
  hint: "`-n` sólo es seguro si el tipo es más ancho que el rango del `int`.",
  rel: ["ft_putchar"] },

{ id: "p3q5", s: 3, st: 2, fn: "ft_conv", type: "choice",
  q: "Tu `ft_conv` trata `'d'` y `'i'` en la misma rama. ¿Qué diferencia hay entre `%d` y `%i` en `printf`?",
  opts: ["`%i` imprime en octal", "Ninguna: ambos imprimen un `int` en decimal con signo (sólo se distinguen en `scanf`)", "`%d` es con signo y `%i` sin signo", "`%i` añade el prefijo `0x` si el valor es grande"],
  ans: 1,
  why: "En `printf` son idénticos: los dos leen un `int` con `va_arg(ap, int)` y lo imprimen en decimal. Sólo en `scanf` cambia, porque `%i` interpreta prefijos (`0x1f` es hexadecimal, `017` octal). Por eso `if (c == 'd' || c == 'i')` basta y no necesitas código duplicado.",
  hint: "Piensa en el caso de uso de `%i` en `scanf` frente a `printf`.",
  rel: ["ft_putnbr"] },

{ id: "p3q6", s: 3, st: 3, fn: "ft_conv", type: "bug",
  q: "`ft_printf(\"%u\", -1)` imprime `18446744073709551615` en vez de `4294967295`. Encuentra la línea errónea.",
  lines: [
    "static int     ft_conv(char c, va_list ap)",
    "{",
    "    if (c == 'c')",
    "        return (ft_putchar((char)va_arg(ap, int)));",
    "    if (c == 's')",
    "        return (ft_putstr(va_arg(ap, char *)));",
    "    if (c == 'd' || c == 'i')",
    "        return (ft_putnbr(va_arg(ap, int)));",
    "    if (c == 'u')",
    "        return (ft_putunbr(va_arg(ap, int), 10, 0));",
    "    if (c == '%')",
    "        return (ft_putchar('%'));",
    "    return (ft_putchar('%') + ft_putchar(c));",
    "}"
  ],
  ans: [9],
  why: "`%u` espera un `unsigned int`, pero la línea 9 lee un `int`: el -1 se convierte a `unsigned long` con extensión de signo y sale 2^64-1. Hay que leer `va_arg(ap, unsigned int)`: así -1 es 4294967295 (2^32-1). Regla general: el tipo de `va_arg` lo manda el especificador, no el valor que creas que llega.",
  hint: "Compara el tipo que lee `va_arg` en `%d` y en `%u`.",
  rel: ["ft_putnbr"] },

{ id: "p3q7", s: 3, st: 2, fn: "ft_conv", type: "sim",
  q: "Simula `ft_printf` con un `%s` nulo, un `%c`, un `%d` negativo y un `%u` negativo.",

{ id: "p3q8", s: 3, st: 3, fn: "ft_conv", type: "multi",
  q: "¿Cuáles de estas llamadas a `ft_printf` devuelven exactamente 5?",
  opts: [
    "`ft_printf(\"%d\", -1234)`",
    "`ft_printf(\"%s\", NULL)`",
    "`ft_printf(\"100%%\")`",
    "`ft_printf(\"%c%c%c%c%c\", 'h', 'o', 'l', 'a', '!')`",
    "`ft_printf(\"%u\", -1)`"
  ],
  ans: [0, 3],
  why: "`-1234` son 5 bytes (signo y cuatro dígitos) y los cinco `%c` escriben un byte cada uno. `%s` con NULL escribe `(null)`: 6. `100%%` escribe `100%`: 4, porque `%%` produce un solo `%`. Y `%u` con -1 son 10 dígitos. El valor de retorno cuenta lo que se escribe, no lo que mide el formato.",
  hint: "No cuentes el formato: cuenta lo que sale por pantalla, signo incluido.",
  rel: ["ft_putnbr", "ft_putstr"] },

{ id: "p3q9", s: 3, st: 2, fn: "ft_putnbr", type: "fill",
  q: "Completa la línea que imprime el último dígito de `n` (con `n >= 0`) como carácter.",
  code: "len += ft_putchar(____ + n % 10);",
  accept: ["'0'", "48"],
  why: "`n % 10` es un número entre 0 y 9, pero `write` escribe bytes que se interpretan como caracteres. El carácter `'0'` vale 48 en ASCII y los dígitos son consecutivos, así que `'0' + 7` es `'7'`. Mejor `'0'` que 48: se lee solo.",
  hint: "En ASCII los dígitos van seguidos empezando por el carácter cero.",
  rel: ["ft_putchar"] },

{ id: "p3q10", s: 3, st: 3, fn: "ft_conv", type: "choice",
  q: "Depurando, escribes `printf(\"A\"); ft_printf(\"B\");` y ejecutas el programa (en terminal o redirigiendo a un fichero). ¿Qué verás?",
  opts: ["`AB`, siempre", "Sólo `B`: `printf` se desactiva si llamas a `write`", "`BA`: el `printf` guarda la A en un buffer y no la vuelca hasta salir", "El orden es aleatorio"],
  ans: 2,
  why: "La `printf` de la libc acumula la salida en un buffer (memoria intermedia) de `stdout` y sólo lo vuelca al llenarse, al ver un `\\n` en terminal o al terminar el programa. Tu `ft_printf` usa `write` directamente, así que `B` sale antes: `BA`. Por eso conviene no mezclar `printf` y `ft_printf` al depurar: el orden de salida no es el del código.",
  hint: "Pregúntate quién escribe sin esperar: `write` o `printf`.",
  rel: ["ft_putchar"] },

/* ---------- SECTOR 4 · BASES ---------- */
{ id: "p4q1", s: 4, st: 2, fn: "hex", type: "choice",
  q: "El hexadecimal (base 16) usa los dígitos `0-9` y `a-f` (a=10 … f=15). ¿Cómo se escribe 1000 en hexadecimal?",
  opts: ["`3e8`", "`e83`", "`3d8`", "`fa0`"],
  ans: 0,
  why: "Divide entre 16: 1000 = 62·16 + 8, luego 62 = 3·16 + 14 (`e`), luego 3 = 0·16 + 3. Los restos salen en el orden 8, `e`, 3, o sea del dígito menos al más significativo, y se leen al revés: `3e8`. Comprobación: 3·256 + 14·16 + 8 = 1000.",
  hint: "Divide entre 16 y lee los restos de abajo arriba.",
  rel: ["base"] },

{ id: "p4q2", s: 4, st: 2, fn: "hex", type: "choice",
  q: "¿Qué imprime `ft_printf(\"%x\", -42)` en una máquina con `int` de 32 bits?",
  opts: ["`-2a`", "`d6`", "`2a`", "`ffffffd6`"],
  ans: 3,
  why: "`%x` lee un `unsigned int`: los 32 bits de -42 (complemento a dos) se reinterpretan como el número sin signo 4294967254, que en hexadecimal es `ffffffd6`. Las conversiones `%x`, `%X` y `%u` nunca imprimen signo menos; por eso `ft_putunbr` recibe un `unsigned` y no hace falta tratar los negativos.",
  hint: "Un negativo en unsigned empieza por muchos bits a 1.",
  rel: ["ft_putunbr"] },

{ id: "p4q3", s: 4, st: 2, fn: "base", type: "choice",
  q: "`ft_putunbr` convierte a base 16 con `n % base` (último dígito) y `n / base` (el resto del número). ¿Por qué se usa recursión?",
  opts: [
    "Porque `%` no funciona con números grandes",
    "Para ahorrar llamadas a `write`",
    "Para que se imprima primero el dígito más significativo: la división da los dígitos al revés",
    "Porque la base 16 no se puede hacer con un `while`"
  ],
  ans: 2,
  why: "Dividiendo sucesivamente obtienes los dígitos de derecha a izquierda (el menos significativo primero), pero hay que imprimirlos de izquierda a derecha. La recursión llama primero con `n / base` (imprime lo de la izquierda) y luego escribe `n % base`. Un `while` también valdría con un buffer o contando potencias, pero la recursión es la forma más corta y sin memoria extra.",
  hint: "Piensa en 1000: ¿qué dígito sale primero al dividir, y cuál queremos escribir primero?",
  rel: ["hex", "ft_putunbr"] },

{ id: "p4q4", s: 4, st: 2, fn: "ft_putunbr", type: "fill",
  q: "Completa la línea que elige el dígito correspondiente a la última cifra de `n` en la base dada.",
  code: "len += ft_putchar(digits[n % ____]);",
  accept: ["base"],
  why: "`digits` es la cadena `\"0123456789abcdef\"` (o con mayúsculas) y el resto de dividir entre la base es justo el índice del dígito: en base 16, 255 % 16 = 15, y `digits[15]` es `f`. Si lo dividieras entre 10 funcionaría sólo en decimal; usar la variable `base` hace que una sola función sirva para `%u`, `%x`, `%X` y `%p`.",
  hint: "Debe valer 10 para `%u` y 16 para `%x`.",
  rel: ["base", "hex"] },

{ id: "p4q5", s: 4, st: 3, fn: "ft_putunbr", type: "build",
  q: "Ordena `ft_putunbr(n, base, upper)`: imprime `n` sin signo en la base indicada (minúsculas o mayúsculas) y devuelve los bytes escritos.",
  sol: [
    "int     ft_putunbr(unsigned long n, unsigned int base, int upper)",
    "{",
    "    const char  *digits;",
    "    int         len;",
    "    digits = \"0123456789abcdef\";",
    "    if (upper)",
    "        digits = \"0123456789ABCDEF\";",
    "    len = 0;",
    "    if (n >= base)",
    "        len += ft_putunbr(n / base, base, upper);",
    "    len += ft_putchar(digits[n % base]);",
    "    return (len);",
    "}"
  ],
  extra: ["    len += ft_putchar(digits[n / base]);", "    len += ft_putunbr(n % base, base, upper);"],
  perm: [[[2, 2], [3, 3]], [[4, 6], [7, 7]]],
  why: "Primero las variables, luego se elige el alfabeto, luego se imprime recursivamente lo de la izquierda y por último el dígito actual. Si cambias las dos últimas operaciones, el número saldría invertido. Con `digits[n / base]` escribirías un dígito equivocado, y recursar con `n % base` imprimiría sólo un dígito. La condición `n >= base` también cubre `n == 0`: imprime `0` directamente.",
  hint: "Antes de escribir el dígito actual, hay que dejar escrito todo lo que va a su izquierda.",
  rel: ["base"] },

{ id: "p4q6", s: 4, st: 2, fn: "ft_putptr", type: "choice",
  q: "En `ft_putptr`, ¿por qué se convierte el puntero con `(unsigned long)p` y no con `(int)p`?",
  opts: [
    "Porque en 64 bits un puntero ocupa 8 bytes y un `int` sólo 4: se perderían los 32 bits altos",
    "Porque `int` no admite valores hexadecimales",
    "Porque `unsigned long` es más rápido",
    "Porque `write` sólo acepta `unsigned long`"
  ],
  ans: 0,
  why: "En Linux de 64 bits una dirección típica es `0x7ffe7e2bfc54` (6 bytes útiles). Pasándola a `int` o `unsigned int` te quedarías con `0x7e2bfc54`, una dirección distinta. `unsigned long` tiene el mismo tamaño que un puntero en Linux/macOS 64 bits, y `unsigned` evita que el hexadecimal salga con signo.",
  hint: "Compara el tamaño en bytes de un puntero y el de un `int`.",
  rel: ["ft_putunbr", "hex"] },

{ id: "p4q7", s: 4, st: 3, fn: "ft_putptr", type: "build",
  q: "Ordena `ft_putptr`: en Linux imprime `(nil)` si el puntero es NULL; si no, `0x` seguido de la dirección en hexadecimal. Devuelve los bytes.",
  sol: [
    "int     ft_putptr(void *p)",
    "{",
    "    int     len;",
    "    if (!p)",
    "        return (ft_putstr(\"(nil)\"));",
    "    len = ft_putstr(\"0x\");",
    "    len += ft_putunbr((unsigned long)p, 16, 0);",
    "    return (len);",
    "}"
  ],
  extra: ["    len += ft_putunbr((unsigned int)p, 16, 0);", "        return (ft_putstr(\"0x0\"));"],
  why: "El caso NULL se resuelve antes de escribir nada: si imprimieras `0x` y luego `(nil)` saldría `0x(nil)`. Después `0x` y el valor en base 16 (minúsculas), sumando los dos bytes escritos. En macOS `printf` de NULL da `0x0` (de ahí el distractor `0x0`), pero en Linux es `(nil)`, que es el comportamiento que copiamos.",
  hint: "El caso especial (NULL) va primero y termina la función con `return`.",
  rel: ["ft_putunbr", "ft_putstr"] },

{ id: "p4q8", s: 4, st: 3, fn: "ft_putunbr", type: "bug",
  q: "`ft_printf(\"%x\", 16)` imprime `0` en lugar de `10`, y `%u` con 10 imprime `0`. Con 17 todo va bien. Encuentra la línea errónea.",
  lines: [
    "int     ft_putunbr(unsigned long n, unsigned int base, int upper)",
    "{",
    "    const char  *digits;",
    "    int         len;",
    "    digits = \"0123456789abcdef\";",
    "    if (upper)",
    "        digits = \"0123456789ABCDEF\";",
    "    len = 0;",
    "    if (n > base)",
    "        len += ft_putunbr(n / base, base, upper);",
    "    len += ft_putchar(digits[n % base]);",
    "    return (len);",
    "}"
  ],
  ans: [8],
  why: "Es un error de límite (off-by-one): con `n > base`, cuando `n` es exactamente igual a la base no se recurre y sólo se escribe `digits[n % base]`, que es `digits[0]`: `0`. Hace falta `n >= base`: 16 en base 16 tiene dos dígitos. Con 17 sí recursa y por eso parece funcionar. Prueba siempre los valores frontera: 0, base - 1, base y base + 1.",
  hint: "¿Cuántos dígitos tiene el número igual a la base?",
  rel: ["base"] },

{ id: "p4q9", s: 4, st: 3, fn: "hex", type: "sim",
  q: "Simula `ft_printf` con un negativo en `%x`, un `%X` y un `%p` nulo.",
  fmt: "%x|%X|%p", args: [-42, 3054, { ptr: 0 }],
  why: "-42 como unsigned es `ffffffd6` (8 bytes, minúsculas por `%x`). 3054 es 0xBEE y `%X` lo escribe en mayúsculas: `BEE`. El `%p` nulo imprime `(nil)` (5 bytes) en Linux; en macOS sería `0x0`. Total: 8 + 1 + 3 + 1 + 5 = 18 bytes.",
  hint: "Recuerda: `%x` lee un `unsigned int` de 32 bits.",
  rel: ["ft_putunbr", "ft_putptr"] },

{ id: "p4q10", s: 4, st: 3, fn: "base", type: "multi",
  q: "¿Cuáles de estas afirmaciones sobre `%x`, `%X` y `%p` son correctas en Linux?",
  opts: [
    "`%x` con 255 escribe 2 bytes (`ff`)",
    "`%x` con 256 escribe 2 bytes",
    "`%p` con NULL escribe 5 bytes (`(nil)`)",
    "`%p` con NULL escribe `0x0`, como en macOS",
    "`%X` con 255 escribe `0XFF`",
    "`%x` con 0 escribe el carácter `0` (1 byte)"
  ],
  ans: [0, 2, 5],
  why: "255 = `ff` (2 dígitos) y 256 = `100` (3 dígitos). Con NULL, Linux imprime `(nil)` y macOS `0x0`. `%X` sólo cambia las letras a mayúsculas (`FF`); el prefijo `0X` sólo aparecería con la flag `#` del bonus. El número 0 se escribe `0`: si tu bucle fuera `while (n > 0)` no escribiría nada, por eso la recursión con `n >= base` es más segura.",
  hint: "Cuenta dígitos: cada 16 veces más de valor añade un dígito hexadecimal.",
  rel: ["ft_putunbr", "ft_putptr"] }
);

/* ===== PRINTF QUEST · contenido ES · sectores 5 (LÍMITES) y 6 (BONUS) ===== */
const _P5H = ["int     ft_printf(const char *fmt, ...)", "{"];
const _P5D = ["    va_list ap;", "    int     len;"];
const _P5C = ["    if (!fmt)", "        return (-1);"];
const _P5L = ["    len = 0;"];
const _P5V = ["    va_start(ap, fmt);"];
const _P5T = ["    while (*fmt)", "    {", "        if (*fmt == '%' && fmt[1])", "            len += ft_conv(*++fmt, ap);", "        else", "            len += ft_putchar(*fmt);", "        fmt++;", "    }", "    va_end(ap);", "    return (len);", "}"];
const _p5mk = (d, mid) => _P5H.concat(d, mid, _P5T);
const _P5D2 = [_P5D[1], _P5D[0]];
const _P5ALTS = [
  _p5mk(_P5D, _P5C.concat(_P5V, _P5L)), _p5mk(_P5D, _P5L.concat(_P5C, _P5V)),
  _p5mk(_P5D2, _P5C.concat(_P5V, _P5L)), _p5mk(_P5D2, _P5L.concat(_P5C, _P5V))
];

{ id: "p5q1", s: 5, st: 3, fn: "buffering", type: "choice",
  q: "Mezclas `printf` de la libc y `write` en el mismo programa y rediriges la salida a un fichero (`./a.out > out.txt`): `printf(\"A\"); write(1, \"B\", 1); printf(\"C\\n\"); write(1, \"D\\n\", 2);`. ¿Qué contiene `out.txt`?",
  opts: ["`ABC\\nD\\n`", "`BD\\nAC\\n`", "`AC\\nBD\\n`", "`BAC\\nD\\n`"], ans: 1,
  why: "`printf` no escribe en el momento: guarda el texto en un buffer (memoria intermedia) de stdio y sólo llama a `write` cuando se llena, al hacer `fflush` o al terminar el programa. `write`, en cambio, va directo al kernel. Con un fichero o una pipe, stdout tiene buffer completo, así que salen antes `B` y `D\\n` y al final `AC\\n`. En una terminal el buffer es de línea (se vacía en cada `\\n`) y saldría `BAC\\nD\\n`. Por eso tu `ft_printf` debe escribir siempre con `write` y no mezclarse con `printf` en las pruebas.",
  hint: "Uno de los dos guarda el texto en memoria y el otro lo manda al kernel al instante.", rel: ["write"] },

{ id: "p5q2", s: 5, st: 3, fn: "ft_printf", type: "sim",
  q: "Tres valores incómodos: el carácter de código 0, un `NULL` en `%s` y un puntero nulo en `%p`. Sigue a `ft_printf` paso a paso.",
  fmt: "[%c]%s|%p", args: [0, null, { ptr: 0 }],
  why: "`%c` con 0 escribe un byte NUL de verdad (`write(1, &c, 1)` no se detiene por ser 0) y cuenta 1 en el retorno, aunque no se vea en pantalla. `%s` con `NULL` imprime `(null)` (6 bytes), como hace glibc, y `%p` con `NULL` imprime `(nil)` (5 bytes) en Linux; en macOS sería `0x0`. Total: `[`, NUL, `]`, `(null)`, `|`, `(nil)` = 15 bytes. Por eso `%c` usa `ft_putchar` y no `ft_putstr`: una cadena que empieza por NUL se vería como vacía y no escribiría nada.",
  hint: "El NUL cuenta como un byte más, y `(null)` y `(nil)` tienen longitudes distintas.", rel: ["ft_putchar", "ft_putstr", "ft_putptr"] },

{ id: "p5q3", s: 5, st: 3, fn: "errors", type: "fill",
  q: "Un caso límite clásico: el formato termina en `%` (por ejemplo `ft_printf(\"100%\")`). Completa la condición para que un `%` final no se trate como el inicio de una conversión.",
  code: "while (*fmt)\n{\n    if (*fmt == '%' && ____)\n        len += ft_conv(*++fmt, ap);\n    else\n        len += ft_putchar(*fmt);\n    fmt++;\n}",
  accept: ["fmt[1]", "*(fmt+1)", "fmt[1]!=0", "fmt[1]!='\\0'", "*(fmt+1)!=0", "*(fmt+1)!='\\0'", "fmt[1]!=NULL"],
  why: "Si `%` es el último carácter, `fmt[1]` es el terminador `'\\0'`. Sin esa comprobación, `*++fmt` apunta al `\\0`, `ft_conv` lo recibe como «conversión» y el `fmt++` del final se salta el terminador: el bucle sigue leyendo memoria que no es tuya. Con `fmt[1]` en la condición, el `%` final cae en la rama `else` y se imprime como un carácter normal. La libc, en cambio, devuelve -1 en este caso; el subject no lo define, así que cualquiera de las dos cosas es defendible si no lees fuera de la cadena.",
  hint: "Mira el carácter que viene justo después del `%` actual.", rel: ["ft_conv"] },

{ id: "p5q4", s: 5, st: 3, fn: "norm", type: "multi",
  q: "La norminette (el verificador de estilo de 42) es parte de la nota. ¿Cuáles de estas reglas son ciertas?",
  opts: ["Una función no puede tener más de 25 líneas de cuerpo.", "Un fichero no puede tener más de 5 funciones.", "Se permite `for` si el bucle cabe en una línea.", "Una función puede recibir hasta 6 parámetros.", "No se puede declarar e inicializar una variable local en la misma línea (`int len = 0;`).", "Las variables locales pueden declararse en mitad de la función."],
  ans: [0, 1, 4],
  why: "La norma limita las funciones a 25 líneas, los ficheros a 5 funciones y las funciones a 4 parámetros. Prohíbe `for` (se usa `while`) y exige declarar las variables al principio del bloque, sin inicializarlas en la declaración. Por eso `ft_printf` se reparte en `ft_conv` y los `ft_put*`, y por eso hay que dividir el trabajo en varios ficheros (`ft_printf.c` y `ft_printf_utils.c`). Una norma rota suspende el proyecto aunque funcione perfectamente.",
  hint: "Los números de la norma son 25, 5 y 4; y `for` está prohibido.", rel: ["ft_printf"] },

{ id: "p5q5", s: 5, st: 3, fn: "errors", type: "choice",
  q: "`write` puede fallar y devolver -1 (por ejemplo, con stdout cerrado: `./a.out >&-`). ¿Cómo debe reaccionar `ft_printf` para devolver -1 en ese caso?",
  opts: ["Hacer siempre `len += ft_conv(...)`: los -1 se acumulan y el resultado ya sale negativo.", "Ignorarlo: `write` sobre stdout nunca falla en la práctica.", "Guardar `r = ft_conv(...)`; si `r < 0`, llamar a `va_end` y devolver -1; si no, `len += r`.", "Llamar a `exit(1)` en cuanto `write` devuelva -1."], ans: 2,
  why: "Si sumas sin mirar, un -1 se mezcla con otros bytes buenos: `5 + (-1)` da 4, que parece un éxito, y varios -1 dan -3 en lugar de -1. Hay que comprobar cada retorno, liberar lo que corresponda (`va_end`) y devolver -1. `exit` no está permitida y además mata el programa del usuario. Ojo: la `printf` real tiene buffer y casi nunca ve el fallo en el momento; tu `ft_printf` escribe al instante y sí lo ve.",
  hint: "Un valor de error y un valor de éxito no se pueden sumar sin mirarlos antes.", rel: ["write", "return_value"] },

{ id: "p5q6", s: 5, st: 4, fn: "ft_printf", type: "bug",
  q: "Con `ft_printf(\"100%\")` (el formato acaba en `%`) ASan avisa de un `heap-buffer-overflow` y la salida lleva un byte `\\0` de más.",
  lines: [
    "int     ft_printf(const char *fmt, ...)",
    "{",
    "    va_list ap;",
    "    int     len;",
    "    len = 0;",
    "    va_start(ap, fmt);",
    "    while (*fmt)",
    "    {",
    "        if (*fmt == '%')",
    "            len += ft_conv(*++fmt, ap);",
    "        else",
    "            len += ft_putchar(*fmt);",
    "        fmt++;",
    "    }",
    "    va_end(ap);",
    "    return (len);",
    "}"
  ], ans: [8],
  why: "La condición `*fmt == '%'` no mira lo que viene detrás. Con un `%` final, `*++fmt` deja `fmt` apuntando al `'\\0'`, `ft_conv` lo toma como conversión desconocida (imprime `%` y un NUL) y el `fmt++` siguiente salta el terminador: el `while (*fmt)` ya lee fuera de la cadena. La corrección es `if (*fmt == '%' && fmt[1])`. Compilar con `-fsanitize=address` es la forma rápida de cazar este tipo de lectura fuera de límites.",
  hint: "¿Qué hay en `fmt[1]` cuando `%` es lo último de la cadena?", rel: ["ft_conv"] },

{ id: "p5q7", s: 5, st: 3, fn: "ft_printf", type: "sim",
  q: "Negativos reinterpretados: el mismo `-1` pasa por `%d` y por `%u`, y `-26` por `%x`. Sigue a `ft_printf` paso a paso.",
  fmt: "%d%%%u%x", args: [-1, -1, -26],
  why: "`%d` lee un `int` con signo y escribe `-1` (2 bytes). `%%` no consume ningún argumento y escribe un `%`. `%u` lee ese mismo patrón de bits como `unsigned int`: -1 pasa a 4294967295 (10 bytes). `%x` hace lo mismo con -26, que es `0xffffffe6` (8 dígitos). Total: 2 + 1 + 10 + 8 = 21 bytes. Si tu `ft_putunbr` recibiera un `int`, o lo convirtieras a `long` con signo, los dos últimos resultados saldrían mal.",
  hint: "Un `int` negativo leído como `unsigned int` suma 2^32.", rel: ["ft_putunbr", "ft_putnbr"] },

{ id: "p5q8", s: 5, st: 4, fn: "errors", type: "choice",
  q: "¿Qué ocurre con los argumentos que no cuadran con el formato? Compara `ft_printf(\"%d %d\\n\", 1)` (faltan) con `ft_printf(\"%d\\n\", 1, 2, 3)` (sobran).",
  opts: ["Ambos casos son comportamiento indefinido (UB) según el estándar de C.", "Si faltan, `va_arg` devuelve 0; si sobran, es un error de compilación.", "Los dos casos devuelven -1 sin escribir nada.", "Si sobran, se evalúan y se ignoran (está definido); si faltan, es UB y `va_arg` lee basura."], ans: 3,
  why: "El estándar dice que los argumentos sobrantes se evalúan y se ignoran, sin problema. Si faltan, el segundo `va_arg` lee un valor que nadie pasó (lo que haya en un registro o en la pila): es comportamiento indefinido, puede imprimir basura o romper. El compilador no te avisa porque `ft_printf` no es la `printf` de la libc (que lleva un atributo especial para que GCC compruebe el formato). Tu función no tiene que defenderse de esto, pero debes saber que es culpa del llamador.",
  hint: "Piensa en qué lee `va_arg` cuando ya no queda nada que leer.", rel: ["va_arg"] },

{ id: "p5q9", s: 5, st: 4, fn: "leaks", type: "bug",
  q: "Con `./a.out >&-` (stdout cerrado) LeakSanitizer informa de un «Direct leak»; con stdout normal no hay fugas. (`ft_itoa` reserva con `malloc`).",
  lines: [
    "int     ft_putnbr(int n)",
    "{",
    "    char    *s;",
    "    int     len;",
    "    s = ft_itoa(n);",
    "    if (!s)",
    "        return (-1);",
    "    len = ft_putstr(s);",
    "    if (len < 0)",
    "        return (-1);",
    "    free(s);",
    "    return (len);",
    "}"
  ], ans: [9],
  why: "Si `write` falla, `ft_putstr` devuelve -1 y la rama `if (len < 0)` sale con `return (-1)` antes de llegar a `free(s)`: la cadena de `ft_itoa` queda perdida. Una fuga (leak) es memoria reservada a la que ya no apunta nadie. Los caminos de error son donde más se esconden, porque en las pruebas normales nunca se ejecutan. Arreglo: liberar antes de comprobar (`free(s)` justo después de `ft_putstr`) y luego `if (len < 0) return (-1)`. Lo más seguro, en cualquier caso, es no usar `malloc` en la parte obligatoria: con recursión, `ft_putnbr` no lo necesita.",
  hint: "Fíjate en todos los `return` y en cuál de ellos sale sin pasar por `free`.", rel: ["ft_putnbr", "ft_putstr"] },

{ id: "p5q10", s: 5, st: 4, fn: "ft_printf", type: "build",
  q: "Ordena `ft_printf` completa: comprueba el formato, recorre la cadena sin leer más allá de un `%` final y cierra la `va_list`. (`ft_conv` es la auxiliar que despacha por carácter; puedes llamarla distinto.)",

{ id: "p6q9", s: 6, st: 4, fn: "parse_spec", type: "build",
  q: "Ordena `parse_spec`: pone la estructura a cero con la precisión en -1 («no pedida»), lee las flags, después el ancho y por último la precisión tras el `.`, y devuelve el puntero a la conversión. (Versión reducida con las flags `-` y `0`; con `#`, `+` y espacio sólo cambia el bucle de flags.)",
  sol: [
    "static const char   *parse_spec(const char *f, t_spec *sp)",
    "{",
    "    memset(sp, 0, sizeof(*sp));",
    "    sp->prec = -1;",
    "    while (*f == '-' || *f == '0')",
    "    {",
    "        sp->minus |= (*f == '-');",
    "        sp->zero |= (*f == '0');",
    "        f++;",
    "    }",
    "    while (*f >= '0' && *f <= '9')",
    "        sp->width = sp->width * 10 + (*f++ - '0');",
    "    if (*f == '.')",
    "    {",
    "        f++;",
    "        sp->prec = 0;",
    "        while (*f >= '0' && *f <= '9')",
    "            sp->prec = sp->prec * 10 + (*f++ - '0');",
    "    }",
    "    return (f);",
    "}"
  ],
  extra: ["    sp->prec = 0;", "        sp->width = sp->width * 10 + (*f - '0');", "    return (f + 1);"],
  perm: [[[6, 6], [7, 7]]],
  why: "Primero se inicializa todo (`memset` a 0) y la precisión se deja en -1, porque 0 es un valor válido (`%.0d`). Las flags son un bucle `while` que consume los caracteres `-` y `0`; el ancho viene después, acumulando `n * 10 + dígito`. Al encontrar `.`, la precisión pasa a 0 y se leen sus dígitos (`%.d` equivale a precisión 0). Cada `*f++` avanza al leer; sin esa progresión el bucle no terminaría. Se devuelve `f` apuntando a la conversión, que `ft_printf` lee a continuación.",
  hint: "La precisión empieza en -1, y sólo pasa a 0 cuando aparece el `.`.", rel: ["flags", "width", "precision"] }
);

   9 ejercicios build (st 1..4), uno por fn, en el orden de SURV_ORDER.
   Funciones completas con 2-3 lineas trampa (extra). Los órdenes alternativos válidos
   se generan con `lin` (órdenes topológicos de bloques independientes) y se pasan en `alts`. */
(function () {
  /* lin(sol, head, tail, units, deps): todos los órdenes válidos de los bloques `units` ([ini, fin] sobre sol),
     respetando deps = [[a, b]] (el bloque a antes que el b). head/tail = líneas fijas al principio/final. */
  const lin = (sol, head, tail, units, deps) => {
    const out = [], n = units.length;
    const rec = (ord) => {
      if (ord.length === n) {
        let r = sol.slice(0, head);
        ord.forEach((i) => { r = r.concat(sol.slice(units[i][0], units[i][1] + 1)); });
        out.push(r.concat(sol.slice(sol.length - tail)));
        return;
      }
      for (let i = 0; i < n; i++) {
        if (ord.indexOf(i) >= 0) continue;
        if (deps.every((d) => d[1] !== i || ord.indexOf(d[0]) >= 0)) rec(ord.concat(i));
      }
    };
    rec([]);
    return out;
  };

    why: "`va_arg(ap, char)` es comportamiento indefinido: al llamar a una función variádica, un `char` se promueve a `int`, así que lo que hay en la lista es un `int`; GCC lo detecta y el programa aborta al ejecutarlo (por eso se lee `int` y luego se convierte con `(char)`). Si `%u` lee `int` en vez de `unsigned int`, el valor -1 se ensancha con signo a `unsigned long` y sale 18446744073709551615 en vez de 4294967295. Y con `16, 0` el `%X` sale en minúsculas: `upper` debe valer 1 sólo para 'X', de ahí `c == 'X'`. Nota: se pasa `ap` por valor; en x86-64 una `va_list` es en realidad un puntero a una estructura oculta, y por eso los `va_arg` de esta función avanzan los argumentos de `ft_printf`."

  /* 7 · ft_printf */
  (function () {
    const sol = [
      "int ft_printf(const char *fmt, ...)",
      "{",
      "    va_list ap;",
      "    int len;",
      "    if (!fmt)",
      "        return (-1);",
      "    len = 0;",
      "    va_start(ap, fmt);",
      "    while (*fmt)",
      "    {",
      "        if (*fmt == '%' && fmt[1])",
      "            len += ft_conv(*++fmt, ap);",
      "        else",
      "            len += ft_putchar(*fmt);",
      "        fmt++;",
      "    }",
      "    va_end(ap);",
      "    return (len);",
      "}"
    ];
    SURV.push({
      id: "sv_ft_printf", st: 3, fn: "ft_printf", type: "build", rel: ["ft_conv", "va_start", "va_end"],
      q: "Monta el `ft_printf` obligatorio: recorre el formato; ante un `%` seguido de otro carácter, delega en `ft_conv`; en cualquier otro caso escribe el carácter tal cual (un `%` suelto al final también). Devuelve el total de bytes escritos, o -1 si `fmt` es NULL.",
      hint: "Si `fmt` es NULL sales antes de `va_start`. Al salir del bucle toca cerrar la lista con `va_end` ANTES del `return`.",

      alts: lin(sol, 2, 11, [[2, 2], [3, 3], [4, 5], [6, 6], [7, 7]],
        [[0, 2], [0, 3], [0, 4], [1, 2], [1, 3], [1, 4], [2, 4]]),
      extra: [
        "            len += ft_conv(*fmt++, ap);",
        "            ft_conv(*++fmt, ap);",
        "        if (*fmt == '%')"
      ],
      why: "Con `*fmt++` se lee el carácter ANTES de avanzar: `ft_conv` recibe el propio `%` (no la letra) y, tras el `fmt++` del final del bucle, la letra se salta: \"%d\" imprime \"%\" y no consume el argumento. Sin `len +=` se escribe lo correcto pero no se cuenta: el valor de retorno queda corto. Y con `if (*fmt == '%')` a secas, un `%` al final del formato hace que `*++fmt` sea el `'\\0'`: `ft_conv` imprime `%` y un NUL, y el `fmt++` del bucle pasa del terminador y lee memoria ajena (ASan lo detecta). El `fmt[1]` evita ese caso. Además, `va_end` va siempre antes del `return`, y `va_start` después de la comprobación de NULL: si saliera antes sin `va_end`, la lista quedaría sin cerrar."
    });
  })();

  /* 8 · parse_spec (bonus) */
  SURV.push({
    id: "sv_parse_spec", st: 4, fn: "parse_spec", type: "build", rel: ["flags", "width", "precision"],
    q: "Monta `parse_spec` (bonus). Recibe `f`, que apunta al primer carácter DESPUÉS del `%`, y rellena `sp` (el `t_spec` de la referencia: `minus, zero, hash, plus, space, width, prec`; `prec` vale -1 si no hay precisión) leyendo en este orden: flags `-0#+ `, ancho, y `.` con la precisión. Devuelve un puntero a la letra de conversión. Usa `memset` (`<string.h>`). La última flag lleva `*f++` para avanzar sin gastar otra línea.",
    hint: "Primero pon todo a cero y `prec` a -1. Cada flag sólo ACTIVA su campo (nunca lo apaga). El ancho y la precisión se acumulan dígito a dígito: `valor * 10 + dígito`.",
    sol: [
      "static const char *parse_spec(const char *f, t_spec *sp)",
      "{",
      "    memset(sp, 0, sizeof(*sp));",
      "    sp->prec = -1;",
      "    while (*f == '-' || *f == '0' || *f == '#' || *f == '+' || *f == ' ')",
      "    {",
      "        sp->minus |= (*f == '-');",
      "        sp->zero |= (*f == '0');",
      "        sp->hash |= (*f == '#');",
      "        sp->plus |= (*f == '+');",
      "        sp->space |= (*f++ == ' ');",
      "    }",
      "    while (*f >= '0' && *f <= '9')",
      "        sp->width = sp->width * 10 + (*f++ - '0');",
      "    if (*f == '.')",
      "    {",
      "        sp->prec = 0;",
      "        while (*++f >= '0' && *f <= '9')",

      "    }",
      "    return (f);",
      "}"
    ],
    perm: [[[6, 6], [7, 7], [8, 8], [9, 9]]],
    extra: [
      "    memset(sp, 0, sizeof(sp));",
      "        sp->minus = (*f == '-');"
    ],
    why: "`sizeof(sp)` es el tamaño del PUNTERO (8 bytes), no el del struct (7 enteros = 28 bytes): `memset` sólo pondría a cero los dos primeros campos y el resto contendría basura (GCC lo avisa con `-Wsizeof-pointer-memaccess`); se escribe `sizeof(*sp)`. Con `=` en vez de `|=`, cada vuelta del bucle reescribe el campo con el carácter actual: en `%-05d` la `-` activa `minus`, pero al leer el `0` la línea vuelve a calcular `minus = (*f == '-')`, que ahora es 0, y la flag se pierde. Por eso las flags acumulan con `|=`. Recuerda que el orden importa: flags, ancho (que no puede empezar por 0, porque ese 0 ya se leyó como flag) y por último `.precisión`."
  });
